[project]
name = "opendota"
version = "0.1.0"
description = ""
authors = [
    {name = "PGuin",email = "138515193+pguin-sudo@users.noreply.github.com"}
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib (>=3.11.2,<4.0.0)"
]


[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["."]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)",
    "basedpyright (>=1.40.2,<2.0.0)",
]
